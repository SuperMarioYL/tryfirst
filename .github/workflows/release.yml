name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build binaries and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build() {
            local goos="$1" goarch="$2"
            local name="tryfirst_${version}_${goos}_${goarch}"
            local out="dist/${name}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o "${out}/tryfirst" .
            tar -C "$out" -czf "${out}.tar.gz" tryfirst
            rm -rf "$out"
          }

          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64

          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
