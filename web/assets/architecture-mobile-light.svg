<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" width="400" height="660" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" data-palette="e68956-e7d86a-f6acae-ca14a045d489" role="img" aria-labelledby="t-54431252 d-38597194"><title id="t-54431252">tryfirst module architecture</title><desc id="d-38597194">Repo input feeds detect, which produces the RunPlan. The optional host gate issues a per-run token. The sandbox runs one container with the stub and demo; receipt seals the observed result.</desc><defs><linearGradient id="am-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4623d"/><stop offset=".55" stop-color="#7c7339"/><stop offset="1" stop-color="#936768"/></linearGradient><pattern id="am-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7dbcb" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="am-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="46"/></filter><marker id="am-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a4623d" stroke-width="1.6"/></marker></defs><style>.flow{stroke-dasharray:5 11;animation:flow 3.2s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-64}}@keyframes pulse{0%,100%{opacity:.28}50%{opacity:.95}}@media (prefers-reduced-motion: reduce){.flow,.pulse{animation:none}}</style><rect width="400" height="660" fill="#fefbf9"/><rect width="400" height="660" fill="url(#am-grid)" opacity=".35"/><text x="22" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.5" fill="#72686b" text-anchor="start" letter-spacing="1">ARCHITECTURE · ONE BINARY, ONE CONTAINER</text><line x1="22" y1="46" x2="378" y2="46" stroke="#f7dbcb" stroke-width="1"/><rect x="22" y="58" width="356" height="52" rx="12" fill="#fef9f7" stroke="#f7dbcb" stroke-width="1.2"/><text x="36" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#271d1c" text-anchor="start">repo</text><text x="36" y="97" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">git URL or local directory</text><rect x="22" y="136" width="356" height="76" rx="12" fill="#fef9f7" stroke="#a4623d" stroke-width="1.2"/><text x="36" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#a4623d" text-anchor="start">internal/detect</text><text x="36" y="175" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">RunPlan with per-command evidence</text><text x="36" y="191" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">package.json · pyproject.toml · README</text><rect x="22" y="238" width="356" height="70" rx="12" fill="#fef9f7" stroke="#a4623d" stroke-width="1.2" stroke-dasharray="5 6"/><text x="36" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#7c7339" text-anchor="start">internal/gate  ·  live</text><text x="36" y="277" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">optional · host-side credential</text><text x="36" y="293" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">per-run token · 20 req · 50k tok · 90s</text><rect x="22" y="334" width="356" height="80" rx="12" fill="#fef9f7" stroke="#a4623d" stroke-width="1.2"/><text x="36" y="354" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#a4623d" text-anchor="start">internal/sandbox  ·  docker run --rm</text><text x="36" y="373" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">--network none · stub :8787 + demo</text><text x="36" y="389" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">stdout and stderr captured verbatim</text><rect x="22" y="452" width="356" height="80" rx="12" fill="#fef9f7" stroke="#a4623d" stroke-width="1.2"/><text x="36" y="472" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#7c7339" text-anchor="start">internal/receipt</text><text x="36" y="491" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">receipt .json · report .html · run .log</text><text x="36" y="507" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#72686b" text-anchor="start">digest = sha256 over canonical JSON</text><line x1="200" y1="110" x2="200" y2="136" stroke="#a4623d" stroke-width="1.4" marker-end="url(#am-arrow)"/><line x1="200" y1="212" x2="200" y2="238" stroke="#a4623d" stroke-width="1.4" marker-end="url(#am-arrow)"/><line x1="200" y1="308" x2="200" y2="334" stroke="#a4623d" stroke-width="1.4" marker-end="url(#am-arrow)"/><line x1="200" y1="426" x2="200" y2="452" stroke="#a4623d" stroke-width="1.4" marker-end="url(#am-arrow)"/><text x="22" y="566" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="8.5" fill="#72686b" text-anchor="start">Container, per-run image and temp dir are removed on exit.</text><text x="22" y="584" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="8.5" fill="#72686b" text-anchor="start">run needs a running Docker daemon; plan needs none.</text></svg>