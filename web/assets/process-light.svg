<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" data-palette="e68956-e7d86a-f6acae-ca14a045d489" role="img" aria-labelledby="t-43772734 d-73919371"><title id="t-43772734">One tryfirst run in five stages</title><desc id="d-73919371">A plan with per-command evidence, a per-run image, one container under --network none with the model stub and demo, a sealed receipt plus offline HTML report, then teardown of the container, image and temp directory.</desc><defs><linearGradient id="pr-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4623d"/><stop offset=".55" stop-color="#7c7339"/><stop offset="1" stop-color="#936768"/></linearGradient><pattern id="pr-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7dbcb" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="pr-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="46"/></filter><marker id="pr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a4623d" stroke-width="1.6"/></marker></defs><style>.flow{stroke-dasharray:5 11;animation:flow 3.2s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-64}}@keyframes pulse{0%,100%{opacity:.28}50%{opacity:.95}}@media (prefers-reduced-motion: reduce){.flow,.pulse{animation:none}}</style><rect width="1000" height="440" fill="#fefbf9"/><rect width="1000" height="440" fill="url(#pr-grid)" opacity=".45"/><ellipse cx="500" cy="210" rx="430" ry="150" fill="#a4623d" opacity=".14" filter="url(#pr-soft)"/><text x="56" y="54" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#72686b" text-anchor="start" letter-spacing="1.6">ONE RUN  ·  tryfirst run &lt;repo&gt;</text><line x1="56" y1="72" x2="944" y2="72" stroke="#f7dbcb" stroke-width="1"/><line x1="104" y1="196" x2="896" y2="196" stroke="#f7dbcb" stroke-width="2"/><line class="flow" x1="104" y1="196" x2="896" y2="196" stroke="#a4623d" stroke-width="2.4" opacity=".85"/><text x="104" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="13.5" fill="#271d1c" text-anchor="middle" font-weight="600" letter-spacing="1.2">PLAN</text><circle cx="104" cy="196" r="26" fill="#fdf7f3" stroke="#a4623d" stroke-width="1.8"/><circle class="pulse" cx="104" cy="196" r="34" fill="none" stroke="#a4623d" stroke-width="1" opacity=".3"/><text x="104" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#a4623d" text-anchor="middle">01</text><text x="104" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">internal/detect</text><text x="104" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">RunPlan + evidence</text><text x="104" y="290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">no Docker needed</text><text x="302" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="13.5" fill="#271d1c" text-anchor="middle" font-weight="600" letter-spacing="1.2">BUILD</text><circle cx="302" cy="196" r="26" fill="#fdf7f3" stroke="#7c7339" stroke-width="1.8"/><circle class="pulse" cx="302" cy="196" r="34" fill="none" stroke="#7c7339" stroke-width="1" opacity=".3"/><text x="302" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#7c7339" text-anchor="middle">02</text><text x="302" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">per-run image</text><text x="302" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">base: node:22-slim</text><text x="302" y="290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">from the plan</text><text x="500" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="13.5" fill="#271d1c" text-anchor="middle" font-weight="600" letter-spacing="1.2">RUN</text><circle cx="500" cy="196" r="26" fill="#fdf7f3" stroke="#936768" stroke-width="1.8"/><circle class="pulse" cx="500" cy="196" r="34" fill="none" stroke="#936768" stroke-width="1" opacity=".3"/><text x="500" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#936768" text-anchor="middle">03</text><text x="500" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">--rm --network none</text><text x="500" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">stub @ 127.0.0.1:8787</text><text x="500" y="290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">demo stdout + stderr</text><text x="698" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="13.5" fill="#271d1c" text-anchor="middle" font-weight="600" letter-spacing="1.2">WRITE</text><circle cx="698" cy="196" r="26" fill="#fdf7f3" stroke="#a4623d" stroke-width="1.8"/><circle class="pulse" cx="698" cy="196" r="34" fill="none" stroke="#a4623d" stroke-width="1" opacity=".3"/><text x="698" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#a4623d" text-anchor="middle">04</text><text x="698" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">receipt .json</text><text x="698" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">report .html + run .log</text><text x="698" y="290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">digest over canonical JSON</text><text x="896" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="13.5" fill="#271d1c" text-anchor="middle" font-weight="600" letter-spacing="1.2">TEARDOWN</text><circle cx="896" cy="196" r="26" fill="#fdf7f3" stroke="#7c7339" stroke-width="1.8"/><circle class="pulse" cx="896" cy="196" r="34" fill="none" stroke="#7c7339" stroke-width="1" opacity=".3"/><text x="896" y="201" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#7c7339" text-anchor="middle">05</text><text x="896" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">container removed</text><text x="896" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">per-run image + temp dir</text><text x="896" y="290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#72686b" text-anchor="middle">nothing left behind</text><line x1="56" y1="372" x2="944" y2="372" stroke="#f7dbcb" stroke-width="1"/><text x="56" y="398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#7c7339" text-anchor="start">verdict: runs | fails | no_runnable_demo</text><text x="944" y="398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#72686b" text-anchor="end">receipt: &lt;report-dir&gt;/&lt;owner&gt;-&lt;repo&gt;-&lt;sha8&gt;.json</text><text x="500" y="424" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif" font-size="10.5" fill="#72686b" text-anchor="middle">The plan is derived; verdict, duration and output only exist after the container ran.</text></svg>